<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Collection</title>

  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- 2. カスタムスタイル -->
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #root { height: 100vh; width: 100vw; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: #94a3b8; }
  </style>

  <!-- 3. Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 4. Reactとアイコンの読み込み設定 -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react"
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900">
  
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { LayoutGrid, Folder, Plus, Link as LinkIcon, User, ExternalLink, Trash2, LogOut, Tag, Compass, Sun, Moon, AlertCircle, Coins } from 'lucide-react';
    
    // --- Firebaseの読み込み ---
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js';

    // 教えてもらったFirebaseの設定
    const firebaseConfig = {
      apiKey: "AIzaSyDauMebzumU_5xJ1QvMsgutMxH2pCu4Tuo",
      authDomain: "urlshop-93270.firebaseapp.com",
      projectId: "urlshop-93270",
      storageBucket: "urlshop-93270.firebasestorage.app",
      messagingSenderId: "815690587169",
      appId: "1:815690587169:web:7bacbf18227abca46f5760",
      measurementId: "G-KE6M0HDYYJ"
    };
    
    // Firebaseの起動
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // URLショップの保存場所
    const appId = "urlshop-93270"; 
    
    // 奈落鯖サイトの保存場所（必要に応じて書き換えてください）
    // もし奈落鯖のコード内で const APP_ID = "naraku" などとしていたら、ここを合わせます。
    const narakuAppId = typeof __app_id !== 'undefined' ? __app_id : 'naraku-achievements';

    function App() {
      // 状態管理
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [loginError, setLoginError] = useState("");
      
      const [categories, setCategories] = useState([]);
      const [items, setItems] = useState([]);
      const [activeCategoryId, setActiveCategoryId] = useState(null);
      
      const [showAddCategoryModal, setShowAddCategoryModal] = useState(false);
      const [newCategoryName, setNewCategoryName] = useState('');
      
      const [showAddItemModal, setShowAddItemModal] = useState(false);
      const [newItemData, setNewItemData] = useState({ title: '', url: '', description: '', price: '無料' });

      const [isDarkMode, setIsDarkMode] = useState(false);
      const [narakuPt, setNarakuPt] = useState(0); // 奈落鯖のポイント
      const messagesEndRef = useRef(null);

      // --- 1. ログイン状態の監視 ---
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      const handleGoogleLogin = async () => {
        setLoginError("");
        const provider = new GoogleAuthProvider();
        try {
          await signInWithPopup(auth, provider);
        } catch (error) {
          console.error("Login Error:", error);
          if (error.code === 'auth/unauthorized-domain') {
            setLoginError("【エラー】このURLからのログインが許可されていません。Firebaseの「承認済みドメイン」にこのサイトのURLを追加してください。");
          } else if (window.location.protocol === 'file:') {
            setLoginError("【エラー】パソコンのファイルを直接開いているためブロックされました。GitHub Pagesにアップロードするか、ローカルサーバーで開いてください。");
          } else {
            setLoginError(`【エラー】ログインに失敗しました: ${error.message}`);
          }
        }
      };

      const handleLogout = async () => {
        try { await signOut(auth); } catch (error) { console.error("Logout Error:", error); }
      };

      // --- 2. データの読み込み (Firestore) ---
      useEffect(() => {
        if (!user) return;

        // カテゴリーの読み込み
        const categoriesRef = collection(db, 'artifacts', appId, 'public', 'data', 'categories');
        const unsubCategories = onSnapshot(categoriesRef, (snapshot) => {
          const cats = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          cats.sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
          setCategories(cats);
          if (cats.length > 0 && !activeCategoryId) {
            setActiveCategoryId(cats[0].id);
          }
        });

        // アイテム(URL)の読み込み
        const itemsRef = collection(db, 'artifacts', appId, 'public', 'data', 'urls');
        const unsubItems = onSnapshot(itemsRef, (snapshot) => {
          const fetchedItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          fetchedItems.sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
          setItems(fetchedItems);
        });

        // ★奈落鯖のポイントを読み込む★
        const profileRef = doc(db, 'artifacts', narakuAppId, 'users', user.uid, 'userData', 'profile');
        const unsubProfile = onSnapshot(profileRef, (docSnap) => {
          if (docSnap.exists() && docSnap.data().pt !== undefined) {
            setNarakuPt(docSnap.data().pt);
          } else {
            setNarakuPt(0);
          }
        });

        return () => {
          unsubCategories();
          unsubItems();
          unsubProfile();
        };
      }, [user, activeCategoryId]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [items, activeCategoryId]);

      const activeItems = items.filter(item => item.categoryId === activeCategoryId);
      const activeCategory = categories.find(c => c.id === activeCategoryId);

      // --- 3. データの追加・削除 (Firestore) ---
      const handleAddCategory = async (e) => {
        e.preventDefault();
        if (!newCategoryName.trim() || !user) return;
        const newDocRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'categories'));
        await setDoc(newDocRef, { name: newCategoryName.trim(), createdBy: user.uid, createdAt: serverTimestamp() });
        setNewCategoryName(''); setShowAddCategoryModal(false); setActiveCategoryId(newDocRef.id);
      };

      const handleAddItem = async (e) => {
        e.preventDefault();
        if (!newItemData.title.trim() || !newItemData.url.trim() || !activeCategoryId || !user) return;
        const newDocRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'urls'));
        await setDoc(newDocRef, { ...newItemData, categoryId: activeCategoryId, createdBy: user.uid, createdAt: serverTimestamp() });
        setNewItemData({ title: '', url: '', description: '', price: '無料' }); setShowAddItemModal(false);
      };

      const handleDeleteItem = async (itemId) => {
        if (!user) return;
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'urls', itemId));
      };

      // --- UI Components ---
      if (authLoading) {
        return (
          <div className={`flex h-screen w-full items-center justify-center font-sans transition-colors duration-300 ${isDarkMode ? 'dark bg-zinc-900 text-gray-100' : 'bg-gray-50 text-gray-900'}`}>
            <div className="flex flex-col items-center">
              <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
              <p className="text-gray-500 dark:text-zinc-400 font-medium">読み込み中...</p>
            </div>
          </div>
        );
      }

      if (!user) {
        return (
          <div className={`flex h-screen w-full items-center justify-center font-sans transition-colors duration-300 ${isDarkMode ? 'dark bg-zinc-900' : 'bg-gray-50'}`}>
            <div className="bg-white dark:bg-zinc-800 p-10 rounded-2xl shadow-xl max-w-sm w-full text-center border border-gray-100 dark:border-zinc-700 transition-colors duration-300">
              <div className="w-16 h-16 bg-indigo-100 dark:bg-indigo-900/50 rounded-2xl mx-auto flex items-center justify-center mb-6 text-indigo-600 dark:text-indigo-400 shadow-inner">
                <Compass size={32} />
              </div>
              <h1 className="text-2xl font-bold text-gray-900 dark:text-white mb-2 transition-colors">ログイン</h1>
              <p className="text-sm text-gray-500 dark:text-zinc-400 mb-6 transition-colors">
                Googleアカウントを使用して<br/>奈落鯖と連携します。
              </p>
              
              <div className="space-y-3">
                <button 
                  onClick={handleGoogleLogin}
                  className="w-full bg-white hover:bg-gray-50 text-gray-700 dark:bg-zinc-700 dark:hover:bg-zinc-600 dark:text-white border border-gray-200 dark:border-zinc-600 font-semibold py-3 px-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-3"
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                  </svg>
                  Googleでログイン
                </button>
              </div>

              {loginError && (
                <div className="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-left flex items-start gap-2">
                  <AlertCircle size={18} className="text-red-500 shrink-0 mt-0.5" />
                  <p className="text-xs text-red-600 font-medium leading-relaxed">{loginError}</p>
                </div>
              )}
              
              <div className="mt-6 flex justify-center">
                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-3 text-gray-400 hover:text-indigo-500 transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-zinc-700" title="テーマ切り替え">
                  {isDarkMode ? <Sun size={20} /> : <Moon size={20} />}
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className={`flex h-screen w-full font-sans overflow-hidden transition-colors duration-300 selection:bg-indigo-100 dark:selection:bg-indigo-500/30 selection:text-indigo-900 dark:selection:text-indigo-200 ${isDarkMode ? 'dark bg-zinc-900 text-gray-200' : 'bg-gray-50 text-gray-800'}`}>
          
          <div className="w-64 bg-white dark:bg-zinc-800 border-r border-gray-200 dark:border-zinc-700 flex-shrink-0 flex flex-col shadow-sm z-10 transition-colors duration-300">
            <div className="h-16 flex items-center px-6 border-b border-gray-100 dark:border-zinc-700 transition-colors duration-300">
              <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white mr-3 shadow-md">
                <Compass size={20} />
              </div>
              <span className="font-bold text-lg tracking-tight text-gray-900 dark:text-white transition-colors">URL Collection</span>
            </div>
            
            <div className="flex-1 overflow-y-auto py-6 px-4 custom-scrollbar">
              <div className="flex items-center justify-between text-xs font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-4 px-2 transition-colors">
                <span>カテゴリー</span>
                <button onClick={() => setShowAddCategoryModal(true)} className="p-1 hover:bg-gray-100 dark:hover:bg-zinc-700 rounded-md text-gray-500 dark:text-zinc-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors" title="カテゴリーを追加">
                  <Plus size={16} />
                </button>
              </div>
              
              <div className="space-y-1">
                {categories.map(cat => (
                  <div 
                    key={cat.id}
                    onClick={() => setActiveCategoryId(cat.id)}
                    className={`group flex items-center px-3 py-2.5 rounded-xl cursor-pointer transition-all duration-200 ${
                      activeCategoryId === cat.id ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 font-semibold' : 'text-gray-600 dark:text-zinc-400 hover:bg-gray-100 dark:hover:bg-zinc-700 hover:text-gray-900 dark:hover:text-white'
                    }`}
                  >
                    <Folder size={18} className={`mr-3 transition-colors ${activeCategoryId === cat.id ? 'text-indigo-500 dark:text-indigo-400' : 'text-gray-400 dark:text-zinc-500 group-hover:text-gray-500 dark:group-hover:text-zinc-300'}`} />
                    <span className="truncate">{cat.name}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="p-4 border-t border-gray-100 dark:border-zinc-700 bg-gray-50/50 dark:bg-zinc-800/50 transition-colors duration-300">
              <div className="flex items-center justify-between bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 p-2 rounded-xl shadow-sm transition-colors duration-300">
                <div className="flex items-center min-w-0 flex-1">
                  {user.photoURL ? (
                    <img src={user.photoURL} alt="User" className="w-9 h-9 rounded-full object-cover border border-gray-200 dark:border-zinc-700" />
                  ) : (
                    <div className="w-9 h-9 rounded-full bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-sm border border-indigo-200 dark:border-indigo-800/50 transition-colors">
                      {user.uid.substring(0,2).toUpperCase()}
                    </div>
                  )}
                  <div className="ml-3 min-w-0">
                    <div className="text-sm font-bold text-gray-900 dark:text-white truncate transition-colors">
                      {user.displayName || `User_${user.uid.substring(0,4)}`}
                    </div>
                    {/* ★ ここに奈落鯖のポイントを表示！ ★ */}
                    <div className="text-xs font-semibold text-yellow-500 mt-0.5 flex items-center gap-1">
                      <Coins size={12} />
                      {narakuPt} pt
                    </div>
                  </div>
                </div>
                
                <div className="flex items-center shrink-0">
                  <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-1.5 text-gray-400 hover:text-indigo-500 dark:hover:text-indigo-400 hover:bg-gray-50 dark:hover:bg-zinc-700 rounded-lg transition-colors mr-0.5" title="テーマ切り替え">
                    {isDarkMode ? <Sun size={16} /> : <Moon size={16} />}
                  </button>
                  <button onClick={handleLogout} className="p-1.5 text-gray-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors" title="ログアウト">
                    <LogOut size={16} />
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div className="flex-1 flex flex-col min-w-0 bg-gray-50 dark:bg-zinc-900 transition-colors duration-300">
            <div className="h-16 px-8 flex items-center justify-between bg-white/80 dark:bg-zinc-800/80 backdrop-blur-md border-b border-gray-200 dark:border-zinc-700 z-10 sticky top-0 transition-colors duration-300">
              <div className="flex items-center">
                {activeCategory ? (
                  <>
                    <Folder size={24} className="text-indigo-500 dark:text-indigo-400 mr-3" />
                    <h2 className="text-xl font-bold text-gray-900 dark:text-white transition-colors">{activeCategory.name}</h2>
                    <span className="ml-4 px-2.5 py-0.5 rounded-full bg-gray-100 dark:bg-zinc-700 text-gray-500 dark:text-zinc-300 text-xs font-medium border border-gray-200 dark:border-zinc-600 transition-colors">
                      {activeItems.length} items
                    </span>
                  </>
                ) : (
                  <h2 className="text-xl font-bold text-gray-400 dark:text-zinc-500 transition-colors">カテゴリーを選択してください</h2>
                )}
              </div>
              
              {activeCategory && (
                <button onClick={() => setShowAddItemModal(true)} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors">
                  <Plus size={18} /> 新しいリンク
                </button>
              )}
            </div>

            <div className="flex-1 overflow-y-auto p-8 custom-scrollbar">
              {activeCategory && activeItems.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center max-w-sm mx-auto">
                  <div className="w-20 h-20 bg-gray-100 dark:bg-zinc-800 rounded-full flex items-center justify-center mb-6 text-gray-400 dark:text-zinc-500 transition-colors">
                    <LayoutGrid size={40} />
                  </div>
                  <h3 className="text-xl font-bold text-gray-900 dark:text-white mb-2 transition-colors">アイテムがありません</h3>
                  <p className="text-gray-500 dark:text-zinc-400 mb-6 transition-colors">
                    このカテゴリーにはまだリンクが追加されていません。<br/>最初のリンクを追加してみましょう。
                  </p>
                  <button onClick={() => setShowAddItemModal(true)} className="text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 px-6 py-2.5 rounded-lg font-semibold transition-colors">
                    リンクを追加する
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                  {activeItems.map((item) => (
                    <div key={item.id} className="group bg-white dark:bg-zinc-800 rounded-2xl shadow-sm hover:shadow-md border border-gray-200 dark:border-zinc-700 overflow-hidden flex flex-col transition-all duration-200 hover:-translate-y-1">
                      <div className="p-5 flex-1 flex flex-col">
                        <div className="flex justify-between items-start mb-3">
                          <div className="flex items-center text-xs text-gray-500 dark:text-zinc-400 font-medium transition-colors">
                            <User size={14} className="mr-1.5 text-gray-400 dark:text-zinc-500" />
                            {item.createdBy === user.uid ? "あなた" : item.createdBy.substring(0,4)}
                          </div>
                          {item.createdBy === user.uid && (
                            <button onClick={() => handleDeleteItem(item.id)} className="text-gray-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 p-1.5 rounded-md opacity-0 group-hover:opacity-100 transition-all" title="削除">
                              <Trash2 size={16} />
                            </button>
                          )}
                        </div>
                        
                        <h3 className="text-lg font-bold text-gray-900 dark:text-white mb-2 leading-tight line-clamp-2 transition-colors">
                          <a href={item.url} target="_blank" rel="noopener noreferrer" className="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
                            {item.title}
                          </a>
                        </h3>
                        
                        {item.description && (
                          <p className="text-gray-500 dark:text-zinc-400 text-sm mb-4 line-clamp-3 flex-1 transition-colors">{item.description}</p>
                        )}
                        
                        {item.price && (
                          <div className="mt-auto pt-4 flex items-center">
                            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-gray-50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 text-xs font-semibold text-gray-600 dark:text-zinc-300 transition-colors">
                              <Tag size={12} className="text-gray-400 dark:text-zinc-500" />
                              {item.price}
                            </span>
                          </div>
                        )}
                      </div>
                      
                      <div className="border-t border-gray-100 dark:border-zinc-700 bg-gray-50 dark:bg-zinc-800/50 p-3 flex justify-between items-center transition-colors">
                        <div className="text-xs text-gray-400 dark:text-zinc-500 font-medium transition-colors">
                          {item.createdAt ? new Date(item.createdAt.toDate()).toLocaleDateString('ja-JP') : ''}
                        </div>
                        <a href={item.url} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1.5 text-sm bg-white dark:bg-zinc-700 border border-gray-200 dark:border-zinc-600 hover:border-indigo-300 dark:hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-300 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-lg shadow-sm transition-all font-medium">
                          開く
                          <ExternalLink size={14} />
                        </a>
                      </div>
                    </div>
                  ))}
                  <div ref={messagesEndRef} className="col-span-full h-1" />
                </div>
              )}
            </div>
          </div>

          {/* --- Modals --- */}
          {showAddCategoryModal && (
            <div className="fixed inset-0 bg-gray-900/40 dark:bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-colors">
              <div className="bg-white dark:bg-zinc-800 w-full max-w-md rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-colors duration-300 border border-transparent dark:border-zinc-700">
                <div className="p-6 border-b border-gray-100 dark:border-zinc-700 flex items-center gap-3 bg-gray-50 dark:bg-zinc-800/80 transition-colors duration-300">
                  <div className="w-10 h-10 bg-white dark:bg-zinc-700 rounded-full flex items-center justify-center text-indigo-600 dark:text-indigo-400 shadow-sm border border-gray-100 dark:border-zinc-600 transition-colors">
                    <Folder size={20} />
                  </div>
                  <h2 className="text-xl font-bold text-gray-900 dark:text-white transition-colors">新しいカテゴリー</h2>
                </div>
                <form onSubmit={handleAddCategory} className="p-6">
                  <div className="mb-6">
                    <label className="block text-sm font-bold text-gray-700 dark:text-zinc-300 mb-2 transition-colors">カテゴリー名</label>
                    <input type="text" value={newCategoryName} onChange={(e) => setNewCategoryName(e.target.value)} className="w-full bg-white dark:bg-zinc-900 border border-gray-300 dark:border-zinc-600 text-gray-900 dark:text-white rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 focus:border-indigo-500 dark:focus:border-indigo-400 transition-all" placeholder="例: デザインツール" required autoFocus />
                  </div>
                  <div className="flex justify-end gap-3">
                    <button type="button" onClick={() => setShowAddCategoryModal(false)} className="px-5 py-2.5 text-gray-600 dark:text-zinc-300 hover:bg-gray-100 dark:hover:bg-zinc-700 rounded-xl font-medium transition-colors">キャンセル</button>
                    <button type="submit" className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white rounded-xl font-semibold transition-colors shadow-sm">作成する</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showAddItemModal && (
            <div className="fixed inset-0 bg-gray-900/40 dark:bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto py-10 transition-colors">
              <div className="bg-white dark:bg-zinc-800 w-full max-w-lg rounded-2xl shadow-2xl flex flex-col my-auto transition-colors duration-300 border border-transparent dark:border-zinc-700">
                <div className="p-6 border-b border-gray-100 dark:border-zinc-700 flex items-center gap-3 bg-gray-50 dark:bg-zinc-800/80 transition-colors duration-300">
                  <div className="w-10 h-10 bg-white dark:bg-zinc-700 rounded-full flex items-center justify-center text-indigo-600 dark:text-indigo-400 shadow-sm border border-gray-100 dark:border-zinc-600 transition-colors">
                    <LinkIcon size={20} />
                  </div>
                  <div>
                    <h2 className="text-xl font-bold text-gray-900 dark:text-white transition-colors">リンクを追加</h2>
                    <p className="text-gray-500 dark:text-zinc-400 text-sm mt-0.5 transition-colors">{activeCategory?.name} に追加します</p>
                  </div>
                </div>
                <form onSubmit={handleAddItem} className="p-6 space-y-5">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 dark:text-zinc-300 mb-2 transition-colors">タイトル <span className="text-red-500 dark:text-red-400">*</span></label>
                    <input type="text" value={newItemData.title} onChange={(e) => setNewItemData({...newItemData, title: e.target.value})} className="w-full bg-white dark:bg-zinc-900 border border-gray-300 dark:border-zinc-600 text-gray-900 dark:text-white rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 transition-all" placeholder="表示されるタイトル" required />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 dark:text-zinc-300 mb-2 transition-colors">URL <span className="text-red-500 dark:text-red-400">*</span></label>
                    <input type="url" value={newItemData.url} onChange={(e) => setNewItemData({...newItemData, url: e.target.value})} className="w-full bg-white dark:bg-zinc-900 border border-gray-300 dark:border-zinc-600 text-gray-900 dark:text-white rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 transition-all" placeholder="https://..." required />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 dark:text-zinc-300 mb-2 transition-colors">タグ / 価格</label>
                    <input type="text" value={newItemData.price} onChange={(e) => setNewItemData({...newItemData, price: e.target.value})} className="w-full bg-white dark:bg-zinc-900 border border-gray-300 dark:border-zinc-600 text-gray-900 dark:text-white rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 transition-all" placeholder="例: 無料, 便利ツール" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 dark:text-zinc-300 mb-2 transition-colors">メモ / 説明</label>
                    <textarea value={newItemData.description} onChange={(e) => setNewItemData({...newItemData, description: e.target.value})} className="w-full bg-white dark:bg-zinc-900 border border-gray-300 dark:border-zinc-600 text-gray-900 dark:text-white rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 transition-all h-28 resize-none" placeholder="このリンクについての補足情報を入力..."></textarea>
                  </div>
                  
                  <div className="flex justify-end gap-3 pt-2">
                    <button type="button" onClick={() => setShowAddItemModal(false)} className="px-5 py-2.5 text-gray-600 dark:text-zinc-300 hover:bg-gray-100 dark:hover:bg-zinc-700 rounded-xl font-medium transition-colors">キャンセル</button>
                    <button type="submit" className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white rounded-xl font-semibold transition-colors shadow-sm">追加する</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
